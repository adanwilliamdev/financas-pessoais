spring.application.name=financas-backend
server.port=${SERVER_PORT:8080}
server.servlet.context-path=/

# Database
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/financas_db?ssl=false}
spring.datasource.username=${DB_USERNAME:admin}
spring.datasource.password=${DB_PASSWORD:admin123}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=false

# JWT
jwt.secret=${JWT_SECRET:7E3F8A9B2C4D5E6F7G8H9I0J1K2L3M4N5O6P7Q8R9S0T1U2V3W4X5Y6Z7A8B9C0D}
jwt.expiration=${JWT_EXPIRATION:86400000}

# File Upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Logging
logging.level.com.financas=INFO
logging.level.org.springframework.security=WARN
logging.level.org.springframework.web=WARN

# CORS
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001,http://localhost:5173}
